<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid">
  <!-- HK-47 head mark. Drawn as one path with evenodd holes so the eye slits and
       the grille show the surface behind them, which keeps the mark legible on
       both light and dark panel backgrounds without needing a -light.svg twin.
       Fill matches the Anthropic clay the agents plugin already ships, because
       the rust of the droid's armour lands in the same place anyway. -->
  <path fill="#D97757" fill-rule="evenodd" d="
    M 128 14
    C 170 14 202 44 208 88
    L 212 132
    C 212 170 198 198 178 222
    L 170 240
    L 86 240
    L 78 222
    C 58 198 44 170 44 132
    L 48 88
    C 54 44 86 14 128 14
    Z

    M 66 100  L 108 114  L 106 130  L 64 116  Z
    M 190 100 L 148 114  L 150 130  L 192 116  Z

    M 110 142 L 146 142 L 146 160 L 110 160 Z
    M 112 170 L 144 170 L 144 188 L 112 188 Z
    M 114 198 L 142 198 L 142 216 L 114 216 Z
  "/>
  <!-- Temple tabs, and the stub antenna proud of the right side of the skull.
       Kept short and thick on purpose: a long thin spike survived the 160px
       render and then read as a stray hair at bar size. -->
  <path fill="#D97757" d="
    M 210 104 L 230 98  L 230 130 L 210 136 Z
    M 46 104  L 26 98   L 26 130  L 46 136  Z
    M 194 54  L 222 30  L 236 46  L 208 70  Z
  "/>
</svg>
