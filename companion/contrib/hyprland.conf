# HK-47 - Hyprland integration
# Add these lines to your Hyprland config (or source this file).
#
# This fork is built to coexist with upstream Alfred, so every name here is
# distinct from his: H rather than B, com.hk47.desktop rather than
# com.alfred.desktop, and /run/user/$UID/hk47.sock rather than alfred.sock.
# Running both with either name shared would leave one of them without a
# listener, and `toggle` would reach whichever bound the socket first.

# Keybind: one key for presence. `hk47 quit` exits non-zero when nothing is
# listening on the socket, so a failed quit is the signal to launch him instead.
# Do not use SUPER+CTRL+H here: that is Omarchy's hardware menu.
bindd = SUPER, H, Show/hide HK-47, exec, ~/.config/hypr/scripts/hk47-presence.sh

# The ear (PERS-11), push-to-talk: hold SUPER + ² to speak, release to send.
# code:49 is the same physical key on AZERTY (²) and QWERTY (grave). Set the
# path to your checkout. The release is bound on the bare key, ignoring
# modifiers (i) and non-consuming (n), because a SUPER + key release bind never
# fires when SUPER is let go first, and a SUPER_L release bind is disarmed by
# the key pressed in between. `test`, never `[`: exec reads a leading [ as
# window rules and the command silently never runs. Only the Lua form below was
# measured; the conf form is its translation.
bindd = SUPER, code:49, HK-47 listen (hold), exec, /path/to/hk47/hk47-ear.py press
bindrnid = , code:49, HK-47 send what was said, exec, test -e "$XDG_RUNTIME_DIR/hk47/ear-recorder.pid" && /path/to/hk47/hk47-ear.py release
#
# The same in an Omarchy Lua config (~/.config/hypr/bindings.lua):
#   o.bind("SUPER + code:49", "HK-47: listen (hold)", "/path/to/hk47/hk47-ear.py press")
#   o.bind("code:49", "HK-47: send what was said",
#     'test -e "$XDG_RUNTIME_DIR/hk47/ear-recorder.pid" && /path/to/hk47/hk47-ear.py release',
#     { release = true, ignore_mods = true, non_consuming = true })

# Optional: hide and show him without stopping the process, so his idle
# rotation and badge state survive being got out of the way.
# bindd = SUPER ALT, H, Hide/show HK-47, exec, hk47 toggle

# Interaction model:
#   - SUPER + left-drag on the sprite  → move HK-47 (Omarchy's global window-move bind
#     `bindm = SUPER, mouse:272, movewindow`; no per-app rule needed here).
# Clicks do nothing: he is a sprite in a diorama, not a button.

# Autostart: off by default, matching upstream Alfred, who has no exec-once.
# He appears when summoned. Uncomment if you want him present from login.
# exec-once = uwsm-app -- hk47

# Window rules: HK-47 must be stripped of all compositor decorations (border, shadow,
# blur, open/close animations) so only the sprite alpha is visible.
windowrulev2 = noborder, class:^(com.hk47.desktop)$
windowrulev2 = noshadow, class:^(com.hk47.desktop)$
windowrulev2 = noblur, class:^(com.hk47.desktop)$
windowrulev2 = noanim, class:^(com.hk47.desktop)$

# He is NOT floated or pinned by default: the window is resizable and joins the tiling
# layout like anything else. The renderer scales the diorama to fill whatever box it is
# given, so the background stays transparent and the picture is what grows. The minimum
# size is the diorama at native density.
#
# Uncomment the pair below to have him back as a fixed corner overlay instead, in which
# case set the `move` coordinates to the corner you want.
# windowrulev2 = float, class:^(com.hk47.desktop)$
# windowrulev2 = pin, class:^(com.hk47.desktop)$
# windowrulev2 = move 1820 980, class:^(com.hk47.desktop)$
