[package]
name = "hk47"
version = "0.1.0"
edition = "2024"
description = "HK-47, a pixel-art desktop companion"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
async-channel = "2"
libc = "0.2"
